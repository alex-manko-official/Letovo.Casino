<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лудоприключение</title>
    <style>
        body { display:flex; height:100vh; margin:0; background:#050304; color:#fff; font-family:'IM Fell English SC',sans-serif; align-items:center; justify-content:center; opacity:1; transition: opacity 1s ease-in-out; }
        .btn { padding:1.5rem 3rem; font-size:2rem; background:#b51d18; color:#fff; border:none; border-radius:12px; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.5); transition: transform .2s; }
        .btn:active { transform:scale(0.95); }
    </style>
</head>
<body>
    <button class="btn" id="startBtn">Начать Лудоприключение</button>
    <script>
        document.getElementById('startBtn').addEventListener('click', () => {
            localStorage.setItem('audioInitialized', 'true');
            // Play start sound
            const startSound = new Audio('assets/sounds/start.mp3');
            startSound.play().then(() => {
                // Mark that start sound has been played
                localStorage.setItem('startSoundPlayed', 'true');
                // optional fade out
                document.body.style.opacity = '0';
                // Wait for sound to end before navigating
                startSound.addEventListener('ended', () => {
                    setTimeout(() => { location.href = 'game.html'; }, 300);
                });
            }).catch(err => {
                // If autoplay blocked, fallback: navigate after short delay?
                console.warn('Autoplay blocked:', err);
                document.body.style.opacity = '0';
                setTimeout(() => { location.href = 'game.html'; }, 300);
            });
        });
    </script>
</body>
</html>
